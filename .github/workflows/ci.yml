name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16.x, 18.x]
        python-version: [3.9, 3.10]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Node dependencies
      run: |
        if [ -f "example-project/package.json" ]; then
          cd example-project
          npm install
          npm test
        fi
    
    - name: Install Python dependencies
      run: |
        if [ -f "scripts_ia/requirements.txt" ]; then
          cd scripts_ia
          pip install -r requirements.txt
          python -m pytest
        fi
    
    - name: Lint code
      run: |
        echo "Running linters..."
        # Adicione seus linters aqui
    
    - name: Security scan
      run: |
        echo "Running security scan..."
        # Adicione seus scanners de segurança aqui

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Build project
      run: |
        echo "Building project..."
        # Adicione seus comandos de build aqui
    
    - name: Run integration tests
      run: |
        echo "Running integration tests..."
        # Adicione seus testes de integração aqui
    
    - name: Create artifact
      uses: actions/upload-artifact@v3
      with:
        name: build-artifact
        path: |
          example-project/
          scripts_ia/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: build-artifact
    
    - name: Deploy to production
      run: |
        echo "Deploying to production..."
        # Adicione seus comandos de deploy aqui